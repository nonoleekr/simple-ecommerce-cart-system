services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${CARTIVA_DB_NAME:-cartiva}
      POSTGRES_USER: ${CARTIVA_DB_USERNAME:-cartiva}
      POSTGRES_PASSWORD: ${CARTIVA_DB_PASSWORD:-cartiva_local}
    ports:
      - "${CARTIVA_DB_PORT:-5432}:5432"
    volumes:
      - cartiva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  cartiva_postgres_data:
